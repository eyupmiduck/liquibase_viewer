# Default configuration for liquibase-viewer.
#
# Point this at the database that holds the Liquibase bookkeeping tables. A
# different file can be selected with `--config <path>` or the CONFIG
# environment variable.
#
# The database password is never stored here: it is read from the environment
# variable named by `database.passwordEnv` (VIEWER_DB_PASSWORD by default).
#
# These values mirror the built-in defaults in src/config.js, which are used
# when this file is absent. Keep the two in sync.

database:
  host: 127.0.0.1
  port: 5432
  name: ddl_utils
  user: postgres
  passwordEnv: VIEWER_DB_PASSWORD
  ssl: false

# The Liquibase changelog table. A database can hold several changelog tables
# for different deployments; point these at the right schema and table.
# ddl_utils keeps its tracking tables in a dedicated `liquibase` schema.
changelog:
  schema: liquibase
  table: ddl_utils_databasechangelog

# The Liquibase lock table.
lock:
  schema: liquibase
  table: ddl_utils_databasechangeloglock

server:
  host: 127.0.0.1
  port: 3210
  pageSize: 25
  maxPageSize: 200
  # Set to false to disable the unlock endpoint (and hide its button).
  allowUnlock: true
